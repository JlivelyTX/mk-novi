<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NOVI · Assign</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="wrap wide">
  <header>
    <div class="co">MK Asset Management</div>
    <div class="mark">NOVI</div>
    <div class="novi">Assign · Operations</div>
  </header>
  <main>
    <h1>Assign the job</h1>
    <p class="lede">Review the job. Set who is doing it. Copy the block into the calendar. You do not open the card.</p>
    <div id="gate">
    <label>Ops pin</label><input id="opspin" />
    <button class="btn" id="opsgo" type="button">Continue</button>
  </div>
  <div id="form" hidden>
  <p class="err" id="err"></p>
    <label>Job #</label><input id="job" />
    <label>Due on site</label><input id="due" type="datetime-local" />
    <label>Asset</label>
    <select id="asset"><option>Boat</option><option>Automotive</option><option>RV</option><option>Aircraft</option></select>
    <label>Who is doing it</label>
    <div class="choices" id="kind">
      <button type="button" class="chip on" data-v="mk">MK crew</button>
      <button type="button" class="chip" data-v="contractor">Contractor</button>
    </div>
    <label id="namelabel">Crew names</label><input id="names" placeholder="People on this job" />
    <label>Lead</label><input id="lead" placeholder="Lead name" />
    <label>Lead phone number</label><input id="phone" inputmode="tel" placeholder="This number opens the card" />
    <label>Site</label><input id="site" />
    <label>Unit</label><input id="unit" placeholder="Stock #, slip #, year / make" />
    <label>Work to do</label><input id="work" />
    <label>Who to see</label><input id="see" placeholder="Name and number on site" />
    <label>Notes</label><textarea id="notes" placeholder="Gate, dock, do not move it"></textarea>
    <button class="btn" id="make" type="button">Copy to calendar</button>
    <div class="station" id="out" hidden>
      <div class="kicker">Paste this in the event</div>
      <div class="how" id="block" style="white-space:pre-wrap"></div>
    </div>
    <div class="group">MK crew</div>
    <div id="mklist"></div>
    <div class="row">
      <input id="mkname" placeholder="Name" />
      <input id="mkphone" placeholder="Phone" inputmode="tel" />
    </div>
    <button class="btn ghost" id="addmk" type="button">Add crew</button>
    <div class="group">Contractors</div>
    <div id="colist"></div>
    <div class="row">
      <input id="coname" placeholder="Company" />
      <input id="cophone" placeholder="Lead phone" inputmode="tel" />
    </div>
    <button class="btn ghost" id="addco" type="button">Add contractor</button>
  </div></main>
</div>
<script src="/assign.js"></script>
</body>
</html>
