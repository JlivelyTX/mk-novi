<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NOVI · Assign</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="wrap wide">
  <header>
    <div class="co">MK Asset Management</div>
    <div class="mark">NOVI</div>
    <div class="novi">Assign · Operations</div>
  </header>
  <main>
    <div id="gate">
      <h1>Assign</h1>
      <p class="lede">Jobs come in from ODIN. Pick who does each one.</p>
      <label>Ops pin</label><input id="opspin" type="password" autocomplete="current-password" />
      <p class="err" id="gateerr"></p>
      <button class="btn" id="opsgo" type="button">Continue</button>
    </div>

    <div id="inbox" hidden>
      <p class="err" id="err"></p>
      <div class="choices" id="tabs">
        <button type="button" class="chip on" data-v="unassigned">Needs crew <span id="n-un"></span></button>
        <button type="button" class="chip" data-v="open">Assigned <span id="n-open"></span></button>
      </div>
      <div id="list"></div>
      <button class="btn ghost" id="refresh" type="button">Refresh</button>

      <div class="group">Testing</div>
      <div class="row">
        <button class="btn ghost" id="addtest" type="button">Add 3 test jobs</button>
        <button class="btn ghost" id="cleartest" type="button">Remove test jobs</button>
      </div>

      <div class="group">Crew and contractors</div>
      <p class="lede">This list moves to ODIN once it holds the roster.</p>
      <div id="people"></div>
      <div class="choices" id="pkind">
        <button type="button" class="chip on" data-v="mk">MK crew</button>
        <button type="button" class="chip" data-v="contractor">Contractor</button>
      </div>
      <div class="row">
        <input id="pname" placeholder="Name or company" />
        <input id="pphone" placeholder="Lead phone" inputmode="tel" />
      </div>
      <button class="btn ghost" id="addp" type="button">Add</button>
    </div>

    <div id="detail" hidden>
      <button class="btn ghost" id="backlist" type="button">Back to jobs</button>
      <div class="station">
        <div class="kicker" id="d-num"></div>
        <p class="how" id="d-cust"></p>
        <div class="facts" id="d-facts"></div>
      </div>
      <p class="err" id="derr"></p>
      <div id="d-assigned" hidden>
        <div class="station">
          <div class="kicker">Assigned to</div>
          <p class="how" id="d-who"></p>
          <p class="lede" id="d-odin"></p>
          <label>Crew link</label>
          <div class="row"><input id="d-link" readonly /><button class="btn ghost" id="copylink" type="button">Copy</button></div>
        </div>
        <button class="btn ghost" id="unassign" type="button">Change who is doing it</button>
      </div>
      <div id="d-pick">
        <div class="group">Who is doing it</div>
        <div id="picker"></div>
        <label>Others on the crew (optional)</label>
        <input id="d-crew" placeholder="Names" />
        <button class="btn" id="assign" type="button">Assign</button>
      </div>
    </div>
  </main>
</div>
<script src="/assign.js"></script>
</body>
</html>
